blueprint:
  name: Reolink Camera Notification
  description: >-
    A blueprint for generating notifications based on Reolink camera triggers.
    Requires Home Assistant 2026.10.0 or newer, Fetch Latest File v4.2.0 or newer,
    a default AI task entity, and the Reolink integration. Images and videos
    uploaded by the Reolink camera via FTP must be accessible via HTTP/HTTPS.
  domain: automation
  homeassistant:
    min_version: "2026.10.0"
  input:
    trigger_sensors:
      name: Binary Sensors that will trigger a notification
      description: The entities that will trigger the automation.  Typically these would be the sensors from the Reolink camera.
      default:
        - binary_sensor.reolink_outdoorgarageeast_person
        - binary_sensor.reolink_outdoorgarageeast_vehicle
        - binary_sensor.reolink_outdoorgarageeast_animal
      selector:
        entity:
          multiple: true
          domain: binary_sensor
    trigger_icons:
      name: Trigger Icons
      description: >-
        The icons for the trigger entities, in the same order. For example, the
        first icon is used for the first sensor. Manual runs, unknown trigger
        entities, and missing icons use mdi:alert.
      default:
        - "mdi:walk"
        - "mdi:car-side"
        - "mdi:rabbit"
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - "mdi:walk"
            - "mdi:car-side"
            - "mdi:rabbit"
    action_delay:
      name: Warmup Delay
      description: The delay before fetching files.  Allow enough time for the camera to start uploading files for the event, since upload waiting may return an older completed file immediately.
      default:
        hours: 0
        minutes: 0
        seconds: 3
      selector:
        duration:
    wait_for_upload:
      name: Wait for Upload
      description: Wait for matching image and video uploads to finish before analyzing the image and sending the notification.
      default: true
      selector:
        boolean:
    upload_timeout:
      name: Upload Wait Timeout
      description: Maximum time in seconds to wait when Wait for Upload is enabled.  At timeout, Fetch Latest File falls back to completed files if available; otherwise, returned files may still be uploading.
      default: 30
      selector:
        number:
          min: 0.001
          step: 0.001
          mode: box
          unit_of_measurement: s
    upload_quiet_period:
      name: Upload Quiet Period
      description: Seconds that a file must remain unchanged to be considered complete when Wait for Upload is enabled and no writer-close notification is available.
      default: 2
      selector:
        number:
          min: 0.001
          step: 0.001
          mode: box
          unit_of_measurement: s
    final_delay:
      name: Cooldown Time
      description: The delay seconds after the notification is sent before any further notifications will be sent.
      default:
        hours: 0
        minutes: 1
        seconds: 0
      selector:
        duration:
    ftp_directory:
      name: FTP Directory
      description: The directory where the image and video will be uploaded to, as seen by Home Assistant and the web server.
      default: /ftproot
    ftp_filename:
      name: FTP Filename
      description: The filename prefix of the images and videos to be fetched.  Usually this will be what you configured the Reolink camera name to be.
      default: Reolink-OutdoorGarageEast
    image_extension:
      name: Image Extension
      description: The file extension for images (e.g., jpg, png, webp)
      default: jpg
      selector:
        text:
    video_extension:
      name: Video Extension
      description: The file extension for videos (e.g., mp4, mov, mkv)
      default: mp4
      selector:
        text:
    url_root:
      name: URL root
      description: The URL that can be used to access the files in the FTP directory.  For example, if the FTP Directory is accessible as "https://example.org/ftp/" then this would be set to "https://example.org".
      default: https://example.org
    image_prompt:
      name: Image Prompt
      description: The prompt to be used for image analysis.
      default: >-
        What appears to be happening in this picture? Focus on the person, vehicle, or animal, not the surroundings. Provide details on the object.  Assume the subject is probably moving not stationary. If there is no obvious subject, say "No Subject Found". The description needs to be short enough to fit in a phone notification, using no more than 90 characters.
      selector:
        text:
          type: text
          multiline: true
    notification_target:
      name: Notification Target
      description: The target for the notification.
      default: notify.melissa_and_scotte_phones
    notification_message:
      name: Notification Message
      description: The message to be included in the notification.
      default: Camera Notification
    notification_group:
      name: Notification Group
      description: The group for the notification.
      default: Camera Notification
    camera_entity_id:
      name: Camera Entity ID
      description: The entity ID of the camera for the Live view.
      default: camera.reolink_outdoorgarageeast_clear
      selector:
        entity:
          domain: camera
    talk_dashboard_url:
      name: Talk Dashboard URL
      description: The URL of the Lovelace dashboard that supports 2-way audio.
      default: /dashboard-cameras/garageoutdooreast


triggers:
  - trigger: state
    entity_id: !input trigger_sensors
    to: "on"

variables:
  # Expose blueprint inputs as variables for use in templates.
  camera_entity: !input camera_entity_id
  url_root_prefix: !input url_root
  trigger_icons: !input trigger_icons
  trigger_sensors: !input trigger_sensors
  image_extension_input: !input image_extension
  video_extension_input: !input video_extension
  image_extension: "{{ image_extension_input | trim | lower | regex_replace('^\\.+', '') }}"
  video_extension: "{{ video_extension_input | trim | lower | regex_replace('^\\.+', '') }}"
  image_content_type: >-
    {{ {'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'png': 'image/png',
        'webp': 'image/webp', 'gif': 'image/gif', 'bmp': 'image/bmp',
        'tif': 'image/tiff', 'tiff': 'image/tiff', 'avif': 'image/avif'}
       .get(image_extension, 'image/' ~ image_extension) }}
  # Use a fallback icon for manual runs, unknown entities, or missing icons.
  trigger_icon: >-
    {% if trigger is defined and trigger.entity_id is defined
          and trigger.entity_id in trigger_sensors %}
      {% set icon_index = trigger_sensors.index(trigger.entity_id) %}
      {{ trigger_icons[icon_index] if icon_index < trigger_icons | length else 'mdi:alert' }}
    {% else %}
      mdi:alert
    {% endif %}

actions:
  - delay: !input action_delay
  - action: fetch_latest_file.fetch
    data:
      filename: !input ftp_filename
      directory: !input ftp_directory
      extension:
        - "{{ image_extension }}"
        - "{{ video_extension }}"
      target_id: !input ftp_filename
      wait_for_upload: !input wait_for_upload
      timeout: !input upload_timeout
      quiet_period: !input upload_quiet_period
    response_variable: latest_files
  - variables:
      image_path: "{{ latest_files['result'].get(image_extension, '') }}"
      video_path: "{{ latest_files['result'].get(video_extension, '') }}"
  # Missing images end the run. Available timeout fallback paths remain usable.
  - condition: template
    value_template: "{{ image_path | length > 0 }}"
  - action: ai_task.generate_data
    data:
      task_name: Describe Picture
      instructions: !input image_prompt
      attachments:
        media_content_id: "media-source://media_source{{ image_path }}"
        media_content_type: "{{ image_content_type }}"
    response_variable: ai_response
  - if:
      - condition: template
        value_template: "{{ 'No Subject Found' not in ai_response.data }}"
    then:
      - action: !input notification_target
        data:
          message: !input notification_message
          data:
            image: "{{ url_root_prefix ~ image_path }}"
            notification_icon: "{{ trigger_icon }}"
            channel: Cameras
            group: !input notification_group
            visibility: private
            priority: high
            importance: high
            ttl: 0
            sticky: "true"
            subject: "{{ ai_response.data }}"
            clickAction: "{{ (url_root_prefix ~ video_path) if video_path else ('entityId:' ~ camera_entity) }}"
            actions:
              - action: URI
                title: Live
                uri: "entityId:{{ camera_entity }}"
              - action: URI
                title: Talk
                uri: !input talk_dashboard_url
      - delay: !input final_delay

mode: single
max_exceeded: silent
